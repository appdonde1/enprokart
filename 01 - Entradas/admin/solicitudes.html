<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a09" />
  <title>Solicitudes · Pro Kart</title>
  <link rel="icon" href="../Logo Prokart.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <div class="admin-shell" id="panelShell" hidden>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar__marca">
        <span class="brand-plate">
          <img src="../Logo Prokart blanco.png" alt="Pro Kart" class="brand-logo" />
        </span>
      </div>
      <nav class="sidebar__nav" id="panelNav" aria-label="Secciones del panel"></nav>
      <div class="sidebar__pie">
        <span id="userBadge" class="badge badge--vip"></span>
        <button type="button" class="btn btn--link" id="btnLogout">Salir</button>
      </div>
    </aside>

    <div class="sidebar__velo" id="sidebarVelo" hidden></div>

    <div class="panel-cuerpo">
      <header class="panel-topbar">
        <button type="button" class="hamburguesa" id="btnMenu"
                aria-label="Abrir menú" aria-expanded="false" aria-controls="sidebar">
          <span></span><span></span><span></span>
        </button>
        <h1 class="panel-topbar__titulo" id="tituloModulo"></h1>
      </header>

      <main class="container container--wide">

      <section class="tab-panel active">

        <nav class="bandejas" id="bandejas">
          <button type="button" class="bandeja active" data-kind="empleo">
            Empleos <span class="bandeja__num" id="numEmpleo">0</span>
          </button>
          <button type="button" class="bandeja" data-kind="publicidad">
            Publicidad <span class="bandeja__num" id="numPublicidad">0</span>
          </button>
          <button type="button" class="bandeja" data-kind="clave">
            Claves <span class="bandeja__num" id="numClave">0</span>
          </button>
        </nav>

        <div class="table-toolbar">
          <select id="filtroEstado" aria-label="Estado">
            <option value="nueva">Sin atender</option>
            <option value="">Todas</option>
            <option value="atendida">Atendidas</option>
          </select>
        </div>

        <div id="listaSolicitudes"></div>

        <!-- La clave generada se muestra una sola vez, acá, para dictarla o
             copiarla. No queda guardada en ningún lado en texto plano. -->
        <div class="clave-nueva" id="claveNueva" hidden>
          <p class="hint">Entregale esta clave. No se vuelve a mostrar.</p>
          <div class="clave-nueva__caja">
            <code id="claveTexto"></code>
            <button type="button" class="btn btn--ghost" id="btnCopiarClave">Copiar</button>
          </div>
          <button type="button" class="btn btn--link" id="btnCerrarClave">Listo</button>
        </div>

      </section>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="js/panel-base.js"></script>
  <script src="js/solicitudes.js"></script>
</body>
</html>
