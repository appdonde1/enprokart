<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Validación de entradas · Pro Kart</title>
  <link rel="icon" href="Logo Prokart.png" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/verificar.css" />
</head>
<body class="verify-body">

  <main class="verify-container">

    <!-- Solo el personal del evento puede validar entradas -->
    <section class="verify-card hidden" id="loginCard">
      <img src="Logo Prokart.png" alt="Pro Kart" class="hero__logo" />
      <p class="verify-card__status">Acceso del personal</p>
      <p class="hint">Inicia sesión para validar entradas.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <span class="error" data-for="login"></span>
        <button type="submit" class="btn btn--primary" id="btnLogin">Entrar</button>
      </form>
    </section>

    <section class="hidden" id="scanCard">
      <div class="verify-card">
        <p class="verify-card__status">Validar entrada</p>
        <form id="codeForm">
          <div class="field">
            <label for="codigo">Código de la entrada</label>
            <input type="text" id="codigo" placeholder="EVT-ORO-..." autocomplete="off" />
          </div>
          <span class="error" data-for="codigo"></span>
          <button type="submit" class="btn btn--primary" id="btnValidar">Validar</button>
        </form>
        <p class="hint" id="staffInfo"></p>
        <button type="button" class="btn btn--link" id="btnLogout">Cerrar sesión</button>
      </div>

      <div class="verify-card hidden" id="resultCard"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/verificar.js"></script>
</body>
</html>
