<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090a09" />
  <title>Validación de entradas · Pro Kart</title>
  <link rel="icon" href="Logo Prokart.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/verificar.css" />
</head>
<body class="verify-body">

  <main class="verify-container">

    <!-- Solo el personal del evento puede validar entradas -->
    <section class="verify-card hidden" id="loginCard">
      <span class="brand-plate brand-plate--auth">
        <img src="Logo Prokart blanco.png" alt="Pro Kart" class="brand-logo brand-logo--auth" />
      </span>
      <p class="verify-card__status">Acceso del personal</p>
      <p class="hint">Inicia sesión para validar entradas.</p>
      <form id="loginForm">
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <span class="error" data-for="login"></span>
        <button type="submit" class="btn btn--primary" id="btnLogin">Entrar</button>
      </form>
    </section>

    <section class="hidden" id="scanCard">
      <div class="verify-card verify-card--scan">
        <div class="verify-brand">
          <span class="brand-plate">
            <img src="Logo Prokart blanco.png" alt="Pro Kart" class="brand-logo" />
          </span>
          <span class="verify-brand__tag">Puerta</span>
        </div>
        <p class="verify-card__status">Validar entrada</p>
        <form id="codeForm">
          <div class="field">
            <label for="codigo">Código de la entrada</label>
            <input type="text" id="codigo" placeholder="EVT-ORO-..." autocomplete="off"
                   autocapitalize="characters" spellcheck="false" />
          </div>
          <span class="error" data-for="codigo"></span>
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="btnValidar">Validar</button>
        </form>
        <p class="hint" id="staffInfo"></p>
        <button type="button" class="btn btn--link" id="btnLogout">Cerrar sesión</button>
      </div>

      <div class="verify-card hidden" id="resultCard"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/verificar.js"></script>
</body>
</html>
