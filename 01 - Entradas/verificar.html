<!DOCTYPE html>
<html lang="es" class="con-barra">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090a09" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pro Kart Entradas" />
  <title>Consulta tus entradas · Pro Kart</title>
  <link rel="icon" href="iconos/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="iconos/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&amp;family=Outfit:wght@300..800&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/verificar.css" />
  <link rel="stylesheet" href="css/barra.css" />
</head>
<body class="verify-body">

  <main class="verify-container">

    <section id="vistaConsulta" class="verify-section">
      <div class="verify-card verify-card--consulta">
        <span class="brand-plate brand-plate--auth">
          <img src="Logo Prokart blanco.png" alt="Pro Kart" class="brand-logo" />
        </span>
        <h2 class="verify-card__status">Consulta tus entradas</h2>
        <p class="hint">Ingresa tu número de documento para ver tus códigos QR de acceso al evento.</p>

        <form id="cedulaForm">
          <div class="field">
            <label for="inputCedula">Cédula / CPF</label>
            <input type="text" id="inputCedula" required autocomplete="off" />
          </div>
          <span class="error" data-for="cedula"></span>
          <button type="submit" class="btn btn--primary btn--block btn--lg" id="btnBuscarCedula">
            Buscar entradas
          </button>
        </form>
      </div>

      <!-- Resultados de las entradas encontradas -->
      <div id="contenedorEntradas" class="entradas-lista hidden"></div>
    </section>

  </main>

  <!-- =====================================================
       BARRA DE LA APP (solo en el teléfono, ver css/barra.css)
       Inicio · Menú · Comprar · Reservar · Mis entradas.
       «Reservar» lleva a Grupos y privados; «Comprar» abre la compra.
       ===================================================== -->
  <nav class="app-barra" aria-label="Navegación de la app">
    <a class="app-barra__item" href="index.html#inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 10.5 12 4l8.5 6.5"/><path d="M5.5 9v10.5h13V9"/><path d="M10 19.5v-5h4v5"/></svg>
      <span>Inicio</span>
    </a>
    <a class="app-barra__item" href="index.html#menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 3v5.5a2.5 2.5 0 0 0 5 0V3"/><path d="M9 3v18"/><path d="M17.5 21V3c-2 1.2-3 3.6-3 6.5V14h3"/></svg>
      <span>Menú</span>
    </a>
    <a class="app-barra__item app-barra__item--comprar" href="index.html#reservar">
      <span class="app-barra__boton"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 8A1.5 1.5 0 0 1 5 6.5h14A1.5 1.5 0 0 1 20.5 8v2.2a1.8 1.8 0 0 0 0 3.6V16a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 16v-2.2a1.8 1.8 0 0 0 0-3.6z"/><path d="M14.5 6.5v2M14.5 11v2M14.5 15.5v2"/></svg></span>
      <span>Comprar</span>
    </a>
    <a class="app-barra__item" href="index.html#experiencias">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="9" cy="8.5" r="3.2"/><path d="M3 19.5a6 6 0 0 1 12 0"/><path d="M15.5 5.6a3.2 3.2 0 0 1 0 5.8"/><path d="M17.5 14a6 6 0 0 1 3.5 5.5"/></svg>
      <span>Reservar</span>
    </a>
    <a class="app-barra__item" href="verificar.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.2"/><path d="M13.5 13.5h2.5v2.5M20 13.5v2.5M13.5 20h2.5M18.5 18.5H20V20"/></svg>
      <span>Mis entradas</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/verificar.js"></script>
</body>
</html>
